<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <h1 class="visually-hidden">Todo App</h1>
    <section class="section header">
      <h3 class="visually-hidden">The Eisenhower Matrix</h3>
      <img class="header-img" src="./eisenhower-matrix.jpg" alt="the eisenhower matrix">
      <a class="more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </section>
    <section class="section">
      <h3 class="section-title">Add Item</h3>
      <div class="task-row-wrapper">
        <input id="new-task"class="input task-input" type="text">
        <button class="button">Add</button>
      </div>
    </section>
    <section class="section">
      <h3 class="section-title">Todo</h3>
      <ul id="incomplete-tasks" class="task-list">
        <li class="task-item">
          <input class="input input-checkbox" type="checkbox">
          <label class="task-label">Pay Bills</label>
          <input type="text" class="input task-input">
          <button class="button btn-edit">Edit</button>
          <button class="button btn-delete">
            <img class="delete-img" src="./remove.svg" alt="remove task">
          </button>
        </li>
        <li class="task-item edit-mode">
          <input class="input input-checkbox" type="checkbox">
          <label class="task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="input task-input">
          <button class="button btn-edit">Save</button>
          <button class="button btn-delete">
            <img class="delete-img" src="./remove.svg" alt="remove task">
          </button>
        </li>
      </ul>
    </section>
    <section class="section">
      <h3 class="section-title">Completed</h3>
      <ul id="completed-tasks" class="task-list">
        <li class="task-item">
          <input class="input input-checkbox" type="checkbox" checked>
          <label class="task-label">See the Doctor</label>
          <input type="text" class="input task-input">
          <button class="button btn-edit">Edit</button>
          <button class="button btn-delete">
            <img class="delete-img" src="./remove.svg" alt="remove task">
          </button>
        </li>
      </ul>
    </section>
    <script src="app.js"></script>
  </body>
</html>
