<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <h1 class="visually-hidden">Todo App</h1>
    <section class="section section-about">
      <h3 class="visually-hidden">The Eisenhower Matrix</h3>
      <img class="section-about__img" src="./eisenhower-matrix.jpg" alt="the eisenhower matrix">
      <a class="section-about__info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </section>
    <section class="section">
      <h3 class="section__title">Add Item</h3>
      <div class="add-task">
        <input class="add-task__input task-input task-input_text" type="text">
        <button class="button">Add</button>
      </div>
    </section>
    <section class="section">
      <h3 class="section__title">Todo</h3>
      <ul class="task-list task-list_incompleted">
        <li class="task-item">
          <input class="task-input task-input_checkbox" type="checkbox">
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task-input task-input_text">
          <button class="button button-edit">Edit</button>
          <button class="button button-delete">
            <img class="button-delete__img" src="./remove.svg" alt="remove task">
          </button>
        </li>
        <li class="task-item task-item_edit-mode">
          <input class="task-input task-input_checkbox" type="checkbox">
          <label class="task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-input task-input_text">
          <button class="button button-edit">Save</button>
          <button class="button button-delete">
            <img class="button-delete__img" src="./remove.svg" alt="remove task">
          </button>
        </li>
      </ul>
    </section>
    <section class="section">
      <h3 class="section__title">Completed</h3>
      <ul class="task-list task-list_completed">
        <li class="task-item">
          <input class="task-input task-input_checkbox" type="checkbox" checked>
          <label class="task-label">See the Doctor</label>
          <input type="text" class="task-input task-input_text">
          <button class="button button-edit">Edit</button>
          <button class="button button-delete">
            <img class="button-delete__img" src="./remove.svg" alt="remove task">
          </button>
        </li>
      </ul>
    </section>
    <script src="app.js"></script>
  </body>
</html>
